name: V8 Projection Integrity Gate

on:
  push:
    branches:
      - main
    paths:
      - "src/v8/**"
      - "scripts/v8-projection-integrity-gate.mjs"
      - ".github/workflows/v8-projection-integrity-gate.yml"
      - "tsconfig.v8.json"
      - "package.json"
      - "package-lock.json"

  workflow_dispatch:

jobs:
  v8-projection-integrity:
    name: V8 Projection Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Diagnose TypeScript installation
        run: |
          node --version
          npm --version
          npm ls typescript --depth=0
          node ./node_modules/typescript/bin/tsc --version

      - name: Compile V8
        run: npm run v8:compile

      - name: Verify V8 build output
        shell: bash
        run: |
          set -euo pipefail

          test -f .v8-build/src/v8/runtime/article-runtime.js
          test -f .v8-build/src/v8/content-compiler/compiler.js
          test -f .v8-build/src/v8/publication-eligibility/evaluator.js
          test -f .v8-build/src/v8/projection/projector.js
          test -f .v8-build/src/v8/foundation/store.js

          echo "V8 build output: PASS"

      - name: Real Internet Projection Integrity Gate
        env:
          V8_SEARCH_API_KEY: ${{ secrets.V8_SEARCH_API_KEY }}
        run: node scripts/v8-projection-integrity-gate.mjs