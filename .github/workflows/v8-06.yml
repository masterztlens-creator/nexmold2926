name: V8-06 Internet Research Acquisition

on:
  workflow_dispatch:
  push:
    paths:
      - "src/v8/intelligence/research-planner/**"
      - "src/v8/intelligence/shared.ts"
      - "src/v8/acquisition/**"
      - "src/v8/foundation/**"
      - "src/v8/evidence/**"
      - "src/v8/domain/**"
      - "tests/v8/intelligence/research-planner/**"
      - "scripts/v8-06-internet-research-gate.mjs"
      - "tsconfig.v8.json"
      - ".github/workflows/v8-06.yml"

permissions:
  contents: read

jobs:
  v8-06-internet-research:
    name: V8-06 real internet research gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Diagnose TypeScript executable state
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Runtime ==="
          node --version
          npm --version

          echo "=== TypeScript package ==="
          npm ls typescript --depth=0

          echo "=== TypeScript package files ==="
          ls -la node_modules/typescript
          ls -la node_modules/typescript/bin
          ls -la node_modules/typescript/lib

          echo "=== Executable existence ==="
          test -e node_modules/typescript/bin/tsc
          test -e node_modules/typescript/lib/tsc.js

          echo "=== TypeScript version ==="
          node ./node_modules/typescript/lib/tsc.js --version

      - name: Verify TypeScript 6.0.3
        shell: bash
        run: |
          set -euo pipefail

          node -e "const p=require('./node_modules/typescript/package.json'); if(p.version!=='6.0.3') process.exit(1)"

      - name: Compile V8
        run: node ./node_modules/typescript/lib/tsc.js -p tsconfig.v8.json

      - name: V8-06 unit test
        run: node --test tests/v8/intelligence/research-planner/acquisition-runner.test.ts

      - name: V8-06 real internet research gate
        run: node scripts/v8-06-internet-research-gate.mjs