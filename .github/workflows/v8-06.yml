name: V8-06 Internet Research Acquisition
on:
  workflow_dispatch:
jobs:
  v8-06-internet-research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Ensure TypeScript 6.0.3
        shell: bash
        run: |
          node -e "const p=require('./package.json'); if(p.devDependencies?.typescript !== '^6.0.3' && p.dependencies?.typescript !== '^6.0.3') process.exit(1)"
          ./node_modules/.bin/tsc --version
      - name: Compile V8
        run: ./node_modules/.bin/tsc -p tsconfig.v8.json
      - name: V8-06 unit test
        run: node --test tests/v8/intelligence/research-planner/acquisition-runner.test.ts
      - name: V8-06 real internet research gate
        env:
          V8_SEARCH_ENDPOINT: ${{ secrets.V8_SEARCH_ENDPOINT }}
          V8_SEARCH_API_KEY: ${{ secrets.V8_SEARCH_API_KEY }}
        run: node scripts/v8-06-internet-research-gate.mjs