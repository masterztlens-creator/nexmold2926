name: V8-22A Semantic Applicability

on:
  push:
    branches:
      - main
    paths:
      - "src/v8/applicability/**"
      - "src/v8/domain/**"
      - "src/v8/constitution/**"
      - "src/v8/acquisition/**"
      - "src/v8/intelligence/web-discovery/**"
      - "src/v8/intelligence/research-planner/**"
      - "src/v8/research/**"
      - "src/v8/runtime/**"
      - "scripts/v8-semantic-applicability-gate.mjs"
      - ".github/workflows/v8-semantic-applicability.yml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.v8.json"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-applicability:
    name: V8-22A Semantic Applicability
    runs-on: ubuntu-latest

    steps:
      - name: Resolve source SHA
        shell: bash
        run: |
          set -euo pipefail

          echo "Source SHA: ${{ github.sha }}"
          echo "Source ref: ${{ github.ref }}"
          echo "Repository: ${{ github.repository }}"

      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify required V8-22A files
        shell: bash
        run: |
          set -euo pipefail

          test -f src/v8/applicability/semantic-types.ts
          test -f src/v8/applicability/semantic.ts

          test -f src/v8/intelligence/web-discovery/bootstrap.ts
          test -f src/v8/intelligence/web-discovery/first-hop.ts
          test -f src/v8/intelligence/web-discovery/first-hop-observer.ts
          test -f src/v8/intelligence/web-discovery/discovery.ts

          test -f src/v8/intelligence/research-planner/acquisition-runner.ts
          test -f src/v8/intelligence/research-planner/self-owned-seed-resolver.ts
          test -f src/v8/research/self-owned-discovery.ts

          test -f src/v8/runtime/article-runtime.ts

          test -f scripts/v8-semantic-applicability-gate.mjs
          test -f .github/workflows/v8-semantic-applicability.yml

      - name: Verify V8-22A has no Tavily dependency
        shell: bash
        run: |
          set -euo pipefail

          if grep -nEi \
            "tavily|V8_SEARCH_API_KEY|searxng|SEARCH_API_KEY" \
            scripts/v8-semantic-applicability-gate.mjs; then
            echo "ERROR: V8-22A gate still contains a forbidden external search dependency."
            exit 1
          fi

          echo "V8-22A external search dependency check: PASS"

      - name: Compile V8
        run: npm run v8:compile

      - name: Verify compiled V8-22A dependencies
        shell: bash
        run: |
          set -euo pipefail

          test -f .v8-build/src/v8/applicability/semantic.js
          test -f .v8-build/src/v8/applicability/semantic-types.js

          test -f .v8-build/src/v8/intelligence/web-discovery/bootstrap.js
          test -f .v8-build/src/v8/intelligence/web-discovery/first-hop.js
          test -f .v8-build/src/v8/intelligence/web-discovery/first-hop-observer.js

          test -f .v8-build/src/v8/intelligence/research-planner/acquisition-runner.js
          test -f .v8-build/src/v8/intelligence/research-planner/self-owned-seed-resolver.js

          test -f .v8-build/src/v8/research/self-owned-discovery.js
          test -f .v8-build/src/v8/runtime/article-runtime.js

      - name: Run V8-22A Semantic Applicability Gate
        run: node scripts/v8-semantic-applicability-gate.mjs

      - name: Emit gate identity
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          echo "[V8-22A] semantic applicability gate identity"
          echo "[V8-22A] source_sha=${GITHUB_SHA}"
          echo "[V8-22A] workflow=${GITHUB_WORKFLOW}"
          echo "[V8-22A] run_id=${GITHUB_RUN_ID}"
          echo "[V8-22A] search_provider=NONE"
          echo "[V8-22A] discovery_owner=V8"
          echo "[V8-22A] acquisition=SELF_OWNED_CRAWL"
          echo "[V8-22A] status=PASS"