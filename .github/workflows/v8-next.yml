
name: NEXMOLD V8 Next Operational Gate

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact 40-character source commit SHA to verify"
        required: true
        type: string
      source_run_id:
        description: "Successful V8 Final workflow run ID that produced the publication handoff"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  v8-next:
    name: V8 Next Operational Verification
    runs-on: ubuntu-latest

    steps:
      - name: Resolve source SHA and source workflow run
        id: source
        shell: bash
        env:
          DISPATCH_SHA: ${{ inputs.source_sha }}
          DISPATCH_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail

          SHA="$(printf '%s' "$DISPATCH_SHA" | tr '[:upper:]' '[:lower:]')"
          RUN_ID="$(printf '%s' "$DISPATCH_RUN_ID" | tr -d '[:space:]')"

          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid source SHA: $SHA"
            exit 1
          fi

          if [[ ! "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid source workflow run ID: $RUN_ID"
            exit 1
          fi

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

          echo "Event: workflow_dispatch"
          echo "Source SHA: $SHA"
          echo "Source workflow run: $RUN_ID"

      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0

      - name: Verify checked out source SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail

          ACTUAL_SHA="$(git rev-parse HEAD)"

          if [[ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]]; then
            echo "::error::Checkout SHA mismatch"
            echo "Expected: $EXPECTED_SHA"
            echo "Actual:   $ACTUAL_SHA"
            exit 1
          fi

          echo "Exact source checkout: PASS"
          echo "Source SHA: $ACTUAL_SHA"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify LKG package contract
        shell: bash
        run: |
          set -euo pipefail

          node - <<'NODE'
          const fs = require('node:fs');

          const packageJson = JSON.parse(
            fs.readFileSync('package.json', 'utf8'),
          );

          const lockfile = JSON.parse(
            fs.readFileSync('package-lock.json', 'utf8'),
          );

          if (packageJson.name !== 'nexmold-v8-full') {
            throw new Error(
              `Unexpected package name: ${packageJson.name}`,
            );
          }

          if (packageJson.engines?.node !== '>=22.12.0') {
            throw new Error(
              `Unexpected Node engine: ${packageJson.engines?.node}`,
            );
          }

          if (packageJson.devDependencies?.typescript !== '6.0.3') {
            throw new Error(
              `Unexpected TypeScript version: ${
                packageJson.devDependencies?.typescript
              }`,
            );
          }

          if (lockfile.lockfileVersion !== 3) {
            throw new Error(
              `Unexpected lockfileVersion: ${lockfile.lockfileVersion}`,
            );
          }

          if (
            lockfile.packages?.['']?.devDependencies?.typescript !==
            '6.0.3'
          ) {
            throw new Error(
              'package-lock.json TypeScript baseline mismatch',
            );
          }

          console.log('LKG package contract: PASS');
          NODE

      - name: Verify source Final workflow run
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          node - <<'NODE'
          const https = require('node:https');

          const runId = process.env.SOURCE_RUN_ID;
          const expectedSha = process.env.SOURCE_SHA;
          const repository = process.env.GITHUB_REPOSITORY;
          const token = process.env.GITHUB_TOKEN;

          function requestJson(url) {
            return new Promise((resolve, reject) => {
              const request = https.request(
                url,
                {
                  method: 'GET',
                  headers: {
                    Accept: 'application/vnd.github+json',
                    Authorization: `Bearer ${token}`,
                    'X-GitHub-Api-Version': '2022-11-28',
                    'User-Agent': 'nexmold-v8-next-gate',
                  },
                },
                (response) => {
                  let body = '';

                  response.setEncoding('utf8');

                  response.on('data', (chunk) => {
                    body += chunk;
                  });

                  response.on('end', () => {
                    if (
                      response.statusCode < 200 ||
                      response.statusCode >= 300
                    ) {
                      reject(
                        new Error(
                          `GitHub API ${response.statusCode}: ${body}`,
                        ),
                      );
                      return;
                    }

                    try {
                      resolve(JSON.parse(body));
                    } catch (error) {
                      reject(error);
                    }
                  });
                },
              );

              request.setTimeout(30 * 1000, () => {
                request.destroy(
                  new Error(
                    'GitHub API request timed out after 30 seconds',
                  ),
                );
              });

              request.on('error', reject);
              request.end();
            });
          }

          (async () => {
            if (!/^[0-9]+$/.test(runId)) {
              throw new Error(
                `Invalid source workflow run ID: ${runId}`,
              );
            }

            if (!/^[0-9a-f]{40}$/i.test(expectedSha)) {
              throw new Error(`Invalid source SHA: ${expectedSha}`);
            }

            if (
              typeof repository !== 'string' ||
              repository.length === 0
            ) {
              throw new Error('GITHUB_REPOSITORY is missing');
            }

            if (
              typeof token !== 'string' ||
              token.length === 0
            ) {
              throw new Error('GITHUB_TOKEN is missing');
            }

            const sourceRunUrl =
              `https://api.github.com/repos/${repository}/actions/runs/${runId}`;

            const timeoutMs = 10 * 60 * 1000;
            const pollIntervalMs = 10 * 1000;
            const startedAt = Date.now();
            let run;

            while (true) {
              run = await requestJson(sourceRunUrl);

              if (
                typeof run?.head_sha !== 'string' ||
                run.head_sha.toLowerCase() !== expectedSha.toLowerCase()
              ) {
                throw new Error(
                  `Source workflow SHA mismatch: expected ${expectedSha}, received ${run?.head_sha}`,
                );
              }

              if (
                run?.name !==
                'NEXMOLD V8 Final + Production Integration'
              ) {
                throw new Error(
                  `Unexpected source workflow: ${run?.name}`,
                );
              }

              if (run.status === 'completed') {
                if (run.conclusion !== 'success') {
                  throw new Error(
                    `Source Final workflow completed unsuccessfully: ${run.conclusion}`,
                  );
                }
                break;
              }

              if (
                ![
                  'queued',
                  'in_progress',
                  'waiting',
                  'requested',
                  'pending',
                ].includes(run.status)
              ) {
                throw new Error(
                  `Unexpected source workflow status: ${run.status}`,
                );
              }

              const elapsedMs = Date.now() - startedAt;

              if (elapsedMs >= timeoutMs) {
                throw new Error(
                  `Timed out waiting for source Final workflow after ${Math.floor(elapsedMs / 1000)} seconds; last status: ${run.status}`,
                );
              }

              console.log(
                `Source Final workflow status: ${run.status}; waiting ${pollIntervalMs / 1000}s before checking again`,
              );

              await new Promise((resolve) =>
                setTimeout(resolve, pollIntervalMs),
              );
            }

            console.log('Source Final workflow verification: PASS');
            console.log(`Source workflow: ${run.name}`);
            console.log(`Source run ID: ${run.id}`);
            console.log(`Source SHA: ${run.head_sha}`);
            console.log(`Source conclusion: ${run.conclusion}`);
          })().catch((error) => {
            console.error(
              'Source Final workflow verification: FAIL',
            );
            console.error(
              error instanceof Error
                ? error.stack || error.message
                : error,
            );
            process.exit(1);
          });
          NODE

      - name: Download V8 publication handoff
        uses: actions/download-artifact@v4
        with:
          name: v8-real-publication-handoff
          path: .nexmold
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify downloaded V8 publication handoff
        id: handoff
        shell: bash
        run: |
          set -euo pipefail

          HANDOFF=".nexmold/v8-real-publication-handoff.json"

          if [ ! -f "$HANDOFF" ]; then
            echo "::error::Downloaded V8 publication handoff is missing: $HANDOFF"
            exit 1
          fi

          node - <<'NODE'
          const fs = require('node:fs');

          const path = '.nexmold/v8-real-publication-handoff.json';
          const payload = JSON.parse(fs.readFileSync(path, 'utf8'));

          if (
            payload?.schema !==
            'nexmold.v8.real-publication-handoff.v1'
          ) {
            throw new Error(
              `Unexpected handoff schema: ${payload?.schema}`,
            );
          }

          if (
            typeof payload.fingerprint !== 'string' ||
            !/^[0-9a-f]{64}$/.test(payload.fingerprint)
          ) {
            throw new Error(
              'Publication handoff fingerprint is missing or invalid',
            );
          }

          if (
            !Array.isArray(payload.pages) ||
            payload.pages.length !== 3
          ) {
            throw new Error(
              `Expected exactly 3 publication pages, received ${
                payload.pages?.length ?? 0
              }`,
            );
          }

          const requiredRoutes = new Set([
            '/knowledge/plastic-injection-molding-wall-thickness/',
            '/de/wissen/plastic-injection-molding-wall-thickness/',
            '/fr/knowledge/plastic-injection-molding-wall-thickness/',
          ]);

          const actualRoutes = new Set(
            payload.pages.map((page) => page?.canonicalRoute),
          );

          if (actualRoutes.size !== requiredRoutes.size) {
            throw new Error(
              'Publication handoff contains duplicate or invalid routes',
            );
          }

          for (const route of requiredRoutes) {
            if (!actualRoutes.has(route)) {
              throw new Error(
                `Publication handoff missing required route: ${route}`,
              );
            }
          }

          const fingerprint = payload.fingerprint.toLowerCase();

          fs.appendFileSync(
            process.env.GITHUB_ENV,
            'NEXMOLD_V8_PUBLICATION_HANDOFF_MODE=CONSUME_EXISTING\n',
            'utf8',
          );

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `fingerprint=${fingerprint}\n`,
            'utf8',
          );

          console.log('Downloaded V8 publication handoff: PASS');
          console.log(`handoff fingerprint: ${fingerprint}`);
          console.log(`publication pages: ${payload.pages.length}`);
          console.log('Production handoff mode: CONSUME_EXISTING');
          NODE

      - name: Install locked dependencies
        run: npm ci

      - name: Compile V8
        run: npm run v8:compile

      - name: Run V8 tests
        run: npm run v8:test

      - name: Real production build
        shell: bash
        env:
          NEXMOLD_SOURCE_SHA: ${{ steps.source.outputs.sha }}
          NEXMOLD_V8_PUBLICATION_HANDOFF_MODE: CONSUME_EXISTING
          NEXMOLD_V8_PUBLICATION_HANDOFF_FINGERPRINT: ${{ steps.handoff.outputs.fingerprint }}
        run: |
          set -euo pipefail

          echo "NEXMOLD_SOURCE_SHA=$NEXMOLD_SOURCE_SHA"
          echo "NEXMOLD_V8_PUBLICATION_HANDOFF_MODE=$NEXMOLD_V8_PUBLICATION_HANDOFF_MODE"
          echo "NEXMOLD_V8_PUBLICATION_HANDOFF_FINGERPRINT=$NEXMOLD_V8_PUBLICATION_HANDOFF_FINGERPRINT"

          test -n "$NEXMOLD_V8_PUBLICATION_HANDOFF_FINGERPRINT"

          node --experimental-strip-types \
            build-orchestrator.mjs

      - name: Run V8 next gate
        env:
          NEXMOLD_SOURCE_SHA: ${{ steps.source.outputs.sha }}
          NEXMOLD_V8_PUBLICATION_HANDOFF_MODE: CONSUME_EXISTING
          NEXMOLD_V8_PUBLICATION_HANDOFF_FINGERPRINT: ${{ steps.handoff.outputs.fingerprint }}
        run: npm run v8:next

      - name: Run V8 first article production
        shell: bash
        env:
          NEXMOLD_SOURCE_SHA: ${{ steps.source.outputs.sha }}
          NEXMOLD_V8_PUBLICATION_HANDOFF_MODE: CONSUME_EXISTING
          NEXMOLD_V8_PUBLICATION_HANDOFF_FINGERPRINT: ${{ steps.handoff.outputs.fingerprint }}
        run: |
          set -euo pipefail

          npm run v8:article:first

      - name: Run V8 article lineage gate
        run: npm run v8:article:lineage

      - name: Verify and stage V8 first article artifacts
        shell: bash
        env:
          NEXMOLD_SOURCE_SHA: ${{ steps.source.outputs.sha }}
          NEXMOLD_SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          NEXMOLD_V8_PUBLICATION_HANDOFF_FINGERPRINT: ${{ steps.handoff.outputs.fingerprint }}
        run: |
          set -euo pipefail

          ARTICLE=".nexmold/v8/articles/plastic-injection-molding-wall-thickness/article.md"
          MANIFEST=".nexmold/v8/articles/plastic-injection-molding-wall-thickness/manifest.json"
          STAGE=".nexmold/v8-first-article-artifact"

          test -s "$ARTICLE" || {
            echo "::error::First article is missing or empty: $ARTICLE"
            exit 1
          }

          test -s "$MANIFEST" || {
            echo "::error::First article manifest is missing or empty: $MANIFEST"
            exit 1
          }

          test -s ".v8-build/src/v8/foundation/hash.js" || {
            echo "::error::Canonical V8 fingerprint implementation is missing."
            exit 1
          }

          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { pathToFileURL } from 'node:url';

          const articlePath =
            '.nexmold/v8/articles/plastic-injection-molding-wall-thickness/article.md';

          const manifestPath =
            '.nexmold/v8/articles/plastic-injection-molding-wall-thickness/manifest.json';

          const article = fs.readFileSync(articlePath, 'utf8');
          const manifest = JSON.parse(
            fs.readFileSync(manifestPath, 'utf8'),
          );

          const hashModule = await import(
            pathToFileURL(
              './.v8-build/src/v8/foundation/hash.js',
            ).href,
          );

          if (typeof hashModule.contentFingerprint !== 'function') {
            throw new Error(
              'Canonical contentFingerprint function is unavailable.',
            );
          }

          if (article.trim().length < 500) {
            throw new Error(
              'Article is shorter than the minimum verification threshold.',
            );
          }

          const actualFingerprint =
            hashModule.contentFingerprint(article);

          const expectedFingerprint =
            manifest?.artifact?.contentFingerprint;

          if (
            typeof expectedFingerprint !== 'string' ||
            !/^[0-9a-f]{64}$/i.test(expectedFingerprint)
          ) {
            throw new Error(
              'Manifest content fingerprint is missing or invalid.',
            );
          }

          if (
            actualFingerprint.toLowerCase() !==
            expectedFingerprint.toLowerCase()
          ) {
            throw new Error(
              'Article content fingerprint does not match the manifest.',
            );
          }

          const evidenceIds =
            manifest?.foundation?.verifiedEvidenceIds;

          const claimIds =
            manifest?.foundation?.claimIds;

          const knowledgeIds =
            manifest?.foundation?.knowledgeIds;

          const provenance =
            manifest?.runtime?.content?.provenance;

          for (const [label, values] of [
            ['verifiedEvidenceIds', evidenceIds],
            ['claimIds', claimIds],
            ['knowledgeIds', knowledgeIds],
            ['content.provenance', provenance],
          ]) {
            if (!Array.isArray(values) || values.length === 0) {
              throw new Error(
                `Manifest lineage is missing or empty: ${label}`,
              );
            }
          }

          for (const [label, values] of [
            ['verifiedEvidenceIds', evidenceIds],
            ['claimIds', claimIds],
            ['knowledgeIds', knowledgeIds],
          ]) {
            if (
              values.some(
                (value) =>
                  typeof value !== 'string' ||
                  value.trim().length === 0,
              )
            ) {
              throw new Error(
                `Manifest contains an invalid ID in ${label}.`,
              );
            }

            if (new Set(values).size !== values.length) {
              throw new Error(
                `Manifest contains duplicate IDs in ${label}.`,
              );
            }
          }

          /*
           * Decision ID authority:
           * foundation.decisionId is the canonical field emitted by
           * scripts/v8-first-article.mjs.
           *
           * runtime.content.decisionId must refer to that same decision.
           * Do not read runtime.decisionId: that field is not emitted
           * at the top level of the actual first-article manifest.
           */
          const foundation = manifest?.foundation;
          const runtime = manifest?.runtime;
          const decisionId = foundation?.decisionId;
          const contentDecisionId = runtime?.content?.decisionId;

          if (
            typeof decisionId !== 'string' ||
            decisionId.trim().length === 0
          ) {
            throw new Error(
              'Foundation decision ID is missing.',
            );
          }

          if (
            typeof contentDecisionId !== 'string' ||
            contentDecisionId.trim().length === 0
          ) {
            throw new Error(
              'Runtime content decision ID is missing.',
            );
          }

          if (contentDecisionId !== decisionId) {
            throw new Error(
              'Runtime content decision ID does not match the canonical Foundation decision ID.',
            );
          }

          if (
            typeof runtime?.content?.id !== 'string' ||
            runtime.content.id.trim().length === 0
          ) {
            throw new Error('Runtime content ID is missing.');
          }

          console.log('First article fingerprint: PASS');
          console.log('First article lineage structure: PASS');
          console.log('First article decision lineage: PASS');
          console.log(`Content fingerprint: ${actualFingerprint}`);
          console.log(`Verified Evidence: ${evidenceIds.length}`);
          console.log(`Claims: ${claimIds.length}`);
          console.log(`Knowledge: ${knowledgeIds.length}`);
          console.log(`Provenance records: ${provenance.length}`);
          console.log(`Decision ID: ${decisionId}`);
          console.log(`Content ID: ${runtime.content.id}`);
          NODE

          rm -rf "$STAGE"
          mkdir -p "$STAGE"

          cp "$ARTICLE" "$STAGE/article.md"
          cp "$MANIFEST" "$STAGE/manifest.json"

          ARTICLE_SHA256="$(sha256sum "$STAGE/article.md" | cut -d ' ' -f 1)"
          MANIFEST_SHA256="$(sha256sum "$STAGE/manifest.json" | cut -d ' ' -f 1)"

          export ARTICLE_SHA256
          export MANIFEST_SHA256

          node --input-type=module - <<'NODE'
          import fs from 'node:fs';

          const stage = '.nexmold/v8-first-article-artifact';
          const manifest = JSON.parse(
            fs.readFileSync(`${stage}/manifest.json`, 'utf8'),
          );

          const required = {
            sourceSha: process.env.NEXMOLD_SOURCE_SHA,
            sourceRunId: process.env.NEXMOLD_SOURCE_RUN_ID,
            verificationRunId: process.env.GITHUB_RUN_ID,
            repository: process.env.GITHUB_REPOSITORY,
            handoffFingerprint:
              process.env.NEXMOLD_V8_PUBLICATION_HANDOFF_FINGERPRINT,
            articleSha256: process.env.ARTICLE_SHA256,
            manifestSha256: process.env.MANIFEST_SHA256,
          };

          for (const [key, value] of Object.entries(required)) {
            if (
              typeof value !== 'string' ||
              value.trim().length === 0
            ) {
              throw new Error(
                `Required verification metadata is missing: ${key}`,
              );
            }
          }

          if (!/^[0-9a-f]{40}$/i.test(required.sourceSha)) {
            throw new Error('Source SHA is invalid.');
          }

          if (!/^[0-9]+$/.test(required.sourceRunId)) {
            throw new Error('Source workflow run ID is invalid.');
          }

          if (!/^[0-9]+$/.test(required.verificationRunId)) {
            throw new Error('Verification workflow run ID is invalid.');
          }

          if (!/^[0-9a-f]{64}$/i.test(required.handoffFingerprint)) {
            throw new Error('Publication handoff fingerprint is invalid.');
          }

          if (
            !/^[0-9a-f]{64}$/i.test(required.articleSha256) ||
            !/^[0-9a-f]{64}$/i.test(required.manifestSha256)
          ) {
            throw new Error('Staged artifact SHA-256 is invalid.');
          }

          const decisionId = manifest?.foundation?.decisionId;
          const contentDecisionId = manifest?.runtime?.content?.decisionId;
          const contentId = manifest?.runtime?.content?.id;

          if (
            typeof decisionId !== 'string' ||
            decisionId.trim().length === 0
          ) {
            throw new Error(
              'Verification metadata cannot be created: Foundation decision ID is missing.',
            );
          }

          if (
            typeof contentDecisionId !== 'string' ||
            contentDecisionId.trim().length === 0 ||
            contentDecisionId !== decisionId
          ) {
            throw new Error(
              'Verification metadata cannot be created: runtime content decision ID does not match Foundation decision ID.',
            );
          }

          if (
            typeof contentId !== 'string' ||
            contentId.trim().length === 0
          ) {
            throw new Error(
              'Verification metadata cannot be created: content ID is missing.',
            );
          }

          const metadata = {
            schema: 'nexmold.v8.first-article-verification.v1',
            ...required,
            articlePath:
              '.nexmold/v8/articles/plastic-injection-molding-wall-thickness/article.md',
            manifestPath:
              '.nexmold/v8/articles/plastic-injection-molding-wall-thickness/manifest.json',
            contentFingerprint:
              manifest.artifact.contentFingerprint,
            articleBytes:
              fs.statSync(`${stage}/article.md`).size,
            manifestBytes:
              fs.statSync(`${stage}/manifest.json`).size,
            verifiedEvidenceCount:
              manifest.foundation.verifiedEvidenceIds.length,
            claimCount:
              manifest.foundation.claimIds.length,
            knowledgeCount:
              manifest.foundation.knowledgeIds.length,
            provenanceCount:
              manifest.runtime.content.provenance.length,
            contentId,
            decisionId,
          };

          fs.writeFileSync(
            `${stage}/verification.json`,
            `${JSON.stringify(metadata, null, 2)}\n`,
            'utf8',
          );

          console.log('First article verification metadata: PASS');
          console.log(`Source SHA: ${metadata.sourceSha}`);
          console.log(`Source Final run ID: ${metadata.sourceRunId}`);
          console.log(`Article SHA-256: ${metadata.articleSha256}`);
          console.log(`Manifest SHA-256: ${metadata.manifestSha256}`);
          console.log(`Handoff fingerprint: ${metadata.handoffFingerprint}`);
          console.log(`Decision ID: ${metadata.decisionId}`);
          NODE

          echo "V8 first article artifact verification: PASS"

      - name: Upload verified V8 first article artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexmold-v8-first-article-${{ steps.source.outputs.sha }}
          path: .nexmold/v8-first-article-artifact
          if-no-files-found: error
          retention-days: 90

      - name: Prepare persisted V8 production artifact
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          NEXMOLD_V8_PUBLICATION_HANDOFF_FINGERPRINT: ${{ steps.handoff.outputs.fingerprint }}
        run: |
          set -euo pipefail

          STAGE="v8-production-artifact"
          CLOSURE=".nexmold/v8-actual-dist-production-closure.json"
          HANDOFF=".nexmold/v8-real-publication-handoff.json"
          LKG=".nexmold/last-known-good.json"

          rm -rf "$STAGE"

          mkdir -p \
            "$STAGE/dist" \
            "$STAGE/proof" \
            "$STAGE/release"

          test -d dist
          test -f "$CLOSURE"
          test -f "$HANDOFF"
          test -f "$LKG"

          BUILD_EPOCH="$(
            node -e '
              const fs = require("node:fs");

              const value =
                JSON.parse(
                  fs.readFileSync(process.argv[1], "utf8"),
                ).buildEpoch;

              if (
                typeof value !== "string" ||
                value.length === 0
              ) {
                throw new Error("Closure buildEpoch is missing");
              }

              process.stdout.write(value);
            ' "$CLOSURE"
          )"

          RELEASE_DIR=".nexmold/releases/$BUILD_EPOCH"

          test -d "$RELEASE_DIR"
          test -f "$RELEASE_DIR/html-manifest.json"

          cp -a dist/. "$STAGE/dist/"

          cp \
            "$CLOSURE" \
            "$STAGE/proof/v8-actual-dist-production-closure.json"

          cp \
            "$HANDOFF" \
            "$STAGE/proof/v8-real-publication-handoff.json"

          cp \
            "$LKG" \
            "$STAGE/proof/last-known-good.json"

          cp -a "$RELEASE_DIR/." "$STAGE/release/"

          node - <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');

          const closurePath =
            'v8-production-artifact/proof/v8-actual-dist-production-closure.json';

          const handoffPath =
            'v8-production-artifact/proof/v8-real-publication-handoff.json';

          const closure = JSON.parse(
            fs.readFileSync(closurePath, 'utf8'),
          );

          const handoff = JSON.parse(
            fs.readFileSync(handoffPath, 'utf8'),
          );

          const sha256 = crypto
            .createHash('sha256')
            .update(fs.readFileSync(closurePath))
            .digest('hex');

          if (
            closure?.handoff?.fingerprint?.toLowerCase() !==
            handoff?.fingerprint?.toLowerCase()
          ) {
            throw new Error(
              'Persisted production artifact handoff fingerprint mismatch',
            );
          }

          if (
            handoff?.fingerprint?.toLowerCase() !==
            process.env.NEXMOLD_V8_PUBLICATION_HANDOFF_FINGERPRINT?.toLowerCase()
          ) {
            throw new Error(
              'Persisted production artifact does not match pinned publication handoff',
            );
          }

          const requiredString = (value, label) => {
            if (
              typeof value !== 'string' ||
              value.trim().length === 0
            ) {
              throw new Error(
                `Persisted artifact required field is missing: ${label}`,
              );
            }

            return value;
          };

          const requiredFingerprint = (value, label) => {
            const fingerprint = requiredString(value, label);

            if (!/^[0-9a-f]{64}$/i.test(fingerprint)) {
              throw new Error(
                `Persisted artifact fingerprint is invalid: ${label}`,
              );
            }

            return fingerprint.toLowerCase();
          };

          if (
            typeof closure?.schema !== 'string' ||
            closure.schema.length === 0
          ) {
            throw new Error(
              'Production closure schema is missing or invalid',
            );
          }

          const metadata = {
            schema: 'nexmold.v8.persisted-production-artifact.v1',

            sourceSha: requiredString(
              process.env.SOURCE_SHA,
              'sourceSha',
            ),

            sourceRunId: requiredString(
              process.env.SOURCE_RUN_ID,
              'sourceRunId',
            ),

            nextRunId: requiredString(
              process.env.GITHUB_RUN_ID,
              'nextRunId',
            ),

            repository: requiredString(
              process.env.GITHUB_REPOSITORY,
              'repository',
            ),

            buildEpoch: requiredString(
              closure.buildEpoch,
              'closure.buildEpoch',
            ),

            handoffFingerprint: requiredFingerprint(
              handoff.fingerprint,
              'handoff.fingerprint',
            ),

            contentId: requiredString(
              closure?.content?.id,
              'closure.content.id',
            ),

            decisionId: requiredString(
              closure?.decision?.id,
              'closure.decision.id',
            ),

            projectionId: requiredString(
              closure?.projection?.id,
              'closure.projection.id',
            ),

            projectionFingerprint: requiredFingerprint(
              closure?.projection?.fingerprint,
              'closure.projection.fingerprint',
            ),

            releaseId: requiredString(
              closure?.release?.id,
              'closure.release.id',
            ),

            releaseFingerprint: requiredFingerprint(
              closure?.release?.fingerprint,
              'closure.release.fingerprint',
            ),

            productionExecutionId: requiredString(
              closure?.productionExecution?.executionId,
              'closure.productionExecution.executionId',
            ),

            productionExecutionFingerprint: requiredFingerprint(
              closure?.productionExecution?.executionFingerprint,
              'closure.productionExecution.executionFingerprint',
            ),

            productionConsumptionId: requiredString(
              closure?.productionConsumption?.consumptionId,
              'closure.productionConsumption.consumptionId',
            ),

            productionConsumptionFingerprint: requiredFingerprint(
              closure?.productionConsumption?.consumptionFingerprint,
              'closure.productionConsumption.consumptionFingerprint',
            ),

            closureSha256: requiredFingerprint(
              sha256,
              'closureSha256',
            ),
          };

          fs.writeFileSync(
            'v8-production-artifact/proof/persisted-artifact-manifest.json',
            JSON.stringify(metadata, null, 2) + '\n',
            'utf8',
          );

          console.log('Persisted production artifact manifest: PASS');
          console.log(`sourceSha: ${metadata.sourceSha}`);
          console.log(`buildEpoch: ${metadata.buildEpoch}`);
          console.log(`handoffFingerprint: ${metadata.handoffFingerprint}`);
          console.log(`decisionId: ${metadata.decisionId}`);
          console.log(`projectionFingerprint: ${metadata.projectionFingerprint}`);
          console.log(`releaseId: ${metadata.releaseId}`);
          console.log(`closureSha256: ${metadata.closureSha256}`);
          NODE

      - name: Upload verified V8 production artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexmold-v8-production-${{ steps.source.outputs.sha }}
          path: v8-production-artifact
          if-no-files-found: error
          retention-days: 90
