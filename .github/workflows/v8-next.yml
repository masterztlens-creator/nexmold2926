name: NEXMOLD V8 Next Operational Gate

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact 40-character source commit SHA to verify"
        required: true
        type: string
      source_run_id:
        description: "Successful V8 Final workflow run ID that produced the publication handoff"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  v8-next:
    name: V8 Next Operational Verification

    runs-on: ubuntu-latest

    steps:
      - name: Resolve source SHA and source workflow run
        id: source
        shell: bash
        env:
          DISPATCH_SHA: ${{ inputs.source_sha }}
          DISPATCH_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail

          SHA="$DISPATCH_SHA"
          RUN_ID="$DISPATCH_RUN_ID"

          SHA="$(printf '%s' "$SHA" | tr '[:upper:]' '[:lower:]')"
          RUN_ID="$(printf '%s' "$RUN_ID" | tr -d '[:space:]')"

          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: Invalid source SHA: $SHA"
            exit 1
          fi

          if [[ ! "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Invalid source workflow run ID: $RUN_ID"
            exit 1
          fi

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

          echo "Event: workflow_dispatch"
          echo "Source SHA: $SHA"
          echo "Source workflow run: $RUN_ID"

      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0

      - name: Verify checked out source SHA
        shell: bash
        run: |
          set -euo pipefail

          ACTUAL_SHA="$(git rev-parse HEAD)"
          EXPECTED_SHA="${{ steps.source.outputs.sha }}"

          if [[ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]]; then
            echo "ERROR: Checkout SHA mismatch"
            echo "Expected: $EXPECTED_SHA"
            echo "Actual:   $ACTUAL_SHA"
            exit 1
          fi

          echo "Exact source checkout: PASS"
          echo "Source SHA: $ACTUAL_SHA"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify LKG package contract
        shell: bash
        run: |
          set -euo pipefail

          node - <<'NODE'
          const fs = require('node:fs');

          const packageJson = JSON.parse(
            fs.readFileSync('package.json', 'utf8'),
          );

          const lockfile = JSON.parse(
            fs.readFileSync('package-lock.json', 'utf8'),
          );

          if (packageJson.name !== 'nexmold-v8-full') {
            throw new Error(
              `Unexpected package name: ${packageJson.name}`,
            );
          }

          if (packageJson.engines?.node !== '>=22.12.0') {
            throw new Error(
              `Unexpected Node engine: ${packageJson.engines?.node}`,
            );
          }

          if (
            packageJson.devDependencies?.typescript !==
            '6.0.3'
          ) {
            throw new Error(
              `Unexpected TypeScript version: ${
                packageJson.devDependencies?.typescript
              }`,
            );
          }

          if (lockfile.lockfileVersion !== 3) {
            throw new Error(
              `Unexpected lockfileVersion: ${
                lockfile.lockfileVersion
              }`,
            );
          }

          if (
            lockfile.packages?.['']?.devDependencies
              ?.typescript !== '6.0.3'
          ) {
            throw new Error(
              'package-lock.json TypeScript baseline mismatch',
            );
          }

          console.log('LKG package contract: PASS');
          NODE

      - name: Verify source Final workflow run
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          node - <<'NODE'
          const https = require('node:https');

          const runId =
            process.env.SOURCE_RUN_ID;

          const expectedSha =
            process.env.SOURCE_SHA;

          const repository =
            process.env.GITHUB_REPOSITORY;

          const token =
            process.env.GITHUB_TOKEN;

          function requestJson(url) {
            return new Promise(
              (resolve, reject) => {
                const request =
                  https.request(
                    url,
                    {
                      method: 'GET',
                      headers: {
                        Accept:
                          'application/vnd.github+json',
                        Authorization:
                          `Bearer ${token}`,
                        'X-GitHub-Api-Version':
                          '2022-11-28',
                        'User-Agent':
                          'nexmold-v8-next-gate',
                      },
                    },
                    (response) => {
                      let body = '';

                      response.setEncoding(
                        'utf8',
                      );

                      response.on(
                        'data',
                        (chunk) => {
                          body += chunk;
                        },
                      );

                      response.on(
                        'end',
                        () => {
                          if (
                            response.statusCode <
                              200 ||
                            response.statusCode >=
                              300
                          ) {
                            reject(
                              new Error(
                                `GitHub API ${response.statusCode}: ${body}`,
                              ),
                            );
                            return;
                          }

                          try {
                            resolve(
                              JSON.parse(body),
                            );
                          } catch (error) {
                            reject(error);
                          }
                        },
                      );
                    },
                  );

                request.on(
                  'error',
                  reject,
                );

                request.end();
              },
            );
          }

          (async () => {
            if (
              !/^[0-9]+$/.test(runId)
            ) {
              throw new Error(
                `Invalid source workflow run ID: ${runId}`,
              );
            }

            if (
              !/^[0-9a-f]{40}$/i.test(
                expectedSha,
              )
            ) {
              throw new Error(
                `Invalid source SHA: ${expectedSha}`,
              );
            }

            if (
              typeof repository !==
                'string' ||
              repository.length === 0
            ) {
              throw new Error(
                'GITHUB_REPOSITORY is missing',
              );
            }

            if (
              typeof token !==
                'string' ||
              token.length === 0
            ) {
              throw new Error(
                'GITHUB_TOKEN is missing',
              );
            }

            const run =
              await requestJson(
                `https://api.github.com/repos/${repository}/actions/runs/${runId}`,
              );

            if (
              typeof run?.head_sha !==
                'string' ||
              run.head_sha.toLowerCase() !==
                expectedSha.toLowerCase()
            ) {
              throw new Error(
                `Source workflow SHA mismatch: expected ${expectedSha}, received ${run?.head_sha}`,
              );
            }

            if (
              run?.name !==
              'NEXMOLD V8 Final + Production Integration'
            ) {
              throw new Error(
                `Unexpected source workflow: ${run?.name}`,
              );
            }

            if (
              run?.conclusion !==
              'success'
            ) {
              throw new Error(
                `Source Final workflow is not successful: ${run?.conclusion}`,
              );
            }

            console.log(
              'Source Final workflow verification: PASS',
            );

            console.log(
              `Source workflow: ${run.name}`,
            );

            console.log(
              `Source run ID: ${run.id}`,
            );

            console.log(
              `Source SHA: ${run.head_sha}`,
            );

            console.log(
              `Source conclusion: ${run.conclusion}`,
            );
          })().catch(
            (error) => {
              console.error(
                'Source Final workflow verification: FAIL',
              );

              console.error(
                error instanceof Error
                  ? error.stack ||
                    error.message
                  : error,
              );

              process.exit(1);
            },
          );
          NODE

      - name: Download V8 publication handoff
        uses: actions/download-artifact@v4
        with:
          name: v8-real-publication-handoff
          path: .nexmold
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify downloaded V8 publication handoff
        shell: bash
        run: |
          set -euo pipefail

          HANDOFF=".nexmold/v8-real-publication-handoff.json"

          if [ ! -f "$HANDOFF" ]; then
            echo "ERROR: Downloaded V8 publication handoff is missing:"
            echo "       $HANDOFF"
            exit 1
          fi

          node - <<'NODE'
          const fs = require('node:fs');

          const path =
            '.nexmold/v8-real-publication-handoff.json';

          const payload =
            JSON.parse(
              fs.readFileSync(
                path,
                'utf8',
              ),
            );

          if (
            payload?.schema !==
            'nexmold.v8.real-publication-handoff.v1'
          ) {
            throw new Error(
              `Unexpected handoff schema: ${payload?.schema}`,
            );
          }

          if (
            typeof payload.fingerprint !==
              'string' ||
            !/^[0-9a-f]{64}$/.test(
              payload.fingerprint,
            )
          ) {
            throw new Error(
              'Publication handoff fingerprint is missing or invalid',
            );
          }

          if (
            !Array.isArray(
              payload.pages,
            ) ||
            payload.pages.length !== 3
          ) {
            throw new Error(
              `Expected exactly 3 publication pages, received ${
                payload.pages?.length ?? 0
              }`,
            );
          }

          const requiredRoutes =
            new Set([
              '/knowledge/plastic-injection-molding-wall-thickness/',
              '/de/wissen/plastic-injection-molding-wall-thickness/',
              '/fr/knowledge/plastic-injection-molding-wall-thickness/',
            ]);

          const actualRoutes =
            new Set(
              payload.pages.map(
                (page) =>
                  page?.canonicalRoute,
              ),
            );

          if (
            actualRoutes.size !==
            requiredRoutes.size
          ) {
            throw new Error(
              'Publication handoff contains duplicate or invalid routes',
            );
          }

          for (
            const route of requiredRoutes
          ) {
            if (
              !actualRoutes.has(route)
            ) {
              throw new Error(
                `Publication handoff missing required route: ${route}`,
              );
            }
          }

          console.log(
            'Downloaded V8 publication handoff: PASS',
          );

          console.log(
            `handoff fingerprint: ${payload.fingerprint}`,
          );

          console.log(
            `publication pages: ${payload.pages.length}`,
          );
          NODE

      - name: Install locked dependencies
        run: npm ci

      - name: Compile V8
        run: npm run v8:compile

      - name: Run V8 tests
        run: npm run v8:test

      - name: Real production build
        shell: bash
        env:
          NEXMOLD_SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail

          echo "NEXMOLD_SOURCE_SHA=$NEXMOLD_SOURCE_SHA"

          node --experimental-strip-types \
            build-orchestrator.mjs

      - name: Run V8 next gate
        run: npm run v8:next