name: NEXMOLD V7.14 Production Gate Matrix

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  v714-gate-matrix:
    name: V7.14 Gate Matrix
    runs-on: ubuntu-latest
    if: false  # 新增这一行，永久不运行此job

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install deps
        run: |
          npm config set registry https://registry.npmmirror.com
          npm ci

      # ---------------------------------------------------------
      # GATE 00 — TypeScript / Astro static contract
      # ---------------------------------------------------------
      - name: GATE 00 — Astro type check
        run: npx astro check

      # ---------------------------------------------------------
      # GATE 01 — V7.14 Core Publication Boundary
      # ---------------------------------------------------------
      - name: GATE 01 — V7.14 Core Gate
        run: node scripts/v714-core-gate.mjs

      # ---------------------------------------------------------
      # GATE 02 — Contract Tests
      # ---------------------------------------------------------
      - name: GATE 02 — V7.14 Contract Tests
        run: npm run v714:contracts

      # ---------------------------------------------------------
      # GATE 03 — Adversarial / Fail-Closed Tests
      # ---------------------------------------------------------
      - name: GATE 03 — V7.14 Adversarial
        run: npm run v714:adversarial

      # ---------------------------------------------------------
      # GATE 04 — Regional Production Gate
      # ---------------------------------------------------------
      - name: GATE 04 — V7.14 Regional Production Gate
        run: npm run v714:regional

      # ---------------------------------------------------------
      # GATE 05 — Release Preflight
      # ---------------------------------------------------------
      - name: GATE 05 — Release Preflight
        run: npm run v714:preflight

      # ---------------------------------------------------------
      # GATE 06 — Production Build Orchestrator
      # ---------------------------------------------------------
      - name: GATE 06 — V7.14 Production Build
        run: npm run v714:build

      # ---------------------------------------------------------
      # GATE 07 — Final Astro Production Build
      # ---------------------------------------------------------
      - name: GATE 07 — Astro Production Build
        run: npx astro build

      # ---------------------------------------------------------
      # Build artifact
      # ---------------------------------------------------------
      - name: Upload production dist
        uses: actions/upload-artifact@v4
        with:
          name: astro-dist-v714
          path: dist

      # ---------------------------------------------------------
      # Final explicit result
      # ---------------------------------------------------------
      - name: V7.14 Gate Matrix — PASS
        run: |
          echo "======================================================="
          echo "[NEXMOLD][V7.14] GATE MATRIX"
          echo "======================================================="
          echo "GATE 00 — Astro Check             : PASS"
          echo "GATE 01 — Core Gate               : PASS"
          echo "GATE 02 — Contract Tests          : PASS"
          echo "GATE 03 — Adversarial              : PASS"
          echo "GATE 04 — Regional Production      : PASS"
          echo "GATE 05 — Release Preflight        : PASS"
          echo "GATE 06 — Production Orchestrator  : PASS"
          echo "GATE 07 — Astro Production Build   : PASS"
          echo "======================================================="
          echo "V7.14 GATE MATRIX = PASS"
          echo "======================================================="