name: NEXMOLD V8-04 Rule Policy Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/v8/**'
      - 'tests/v8/**'
      - '.github/workflows/v8-04.yml'
      - '.github/workflows/v8-final.yml'
      - 'tsconfig.v8.json'

permissions:
  contents: read

jobs:
  v8-04:
    name: V8-04 Rule Policy Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source with full history for manifest ancestry
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install TypeScript compiler
        run: npm install --no-save --no-package-lock typescript@6.0.3

      - name: GATE 01 — V8 compile
        run: npm run v8:compile

      - name: GATE 02 — V8 regression suite
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' TEST_FILES < <(find tests/v8 -type f -name '*.test.mjs' -print0 | sort -z)
          if [ "${#TEST_FILES[@]}" -eq 0 ]; then
            echo "No V8 test files found."
            exit 1
          fi
          node --test "${TEST_FILES[@]}"

      - name: GATE 03 — V8-04 Rule Policy contracts
        run: node tests/v8/governance/v8-04-rule-policy.test.mjs

      - name: GATE 04 — V8 clean-room dependency scan
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nEi "src/regional|/regional/|from [\"']\.\.?/.*v7|from [\"'].*v7/" -- src/v8; then
            echo "V8-04-V7-DEPENDENCY FAIL"
            exit 1
          fi
          echo "V8-04-V7-DEPENDENCY PASS"

      - name: GATE 05 — changed-file manifest integrity
        shell: bash
        run: |
          set -euo pipefail

          BASE="129ce1fc45b2f13473033b940b318233ead97eac"

          if ! git cat-file -e "${BASE}^{commit}"; then
            echo "V8-04-BASE-COMMIT-MISSING FAIL"
            exit 1
          fi

          EXPECTED=(
            ".github/workflows/v8-04.yml"
            "src/v8/foundation/state-machine.ts"
            "src/v8/foundation/store.ts"
            "src/v8/foundation/types.ts"
            "src/v8/governance/index.ts"
            "src/v8/governance/policy.ts"
            "src/v8/governance/rule-policy-governance.ts"
            "src/v8/governance/rule.ts"
            "src/v8/publication/artifact.ts"
            "tests/v8/governance/v8-04-rule-policy.test.mjs"
          )

          ACTUAL=$(git diff --name-only "$BASE" HEAD | grep -E '^(\.github/workflows/v8-04\.yml|src/v8/foundation/(state-machine|store|types)\.ts|src/v8/governance/(index|policy|rule-policy-governance|rule)\.ts|src/v8/publication/artifact\.ts|tests/v8/governance/v8-04-rule-policy\.test\.mjs)$' | sort || true)
          printf '%s\n' "$ACTUAL" > /tmp/v8-04-actual.txt
          printf '%s\n' "${EXPECTED[@]}" | sort > /tmp/v8-04-expected.txt

          if ! diff -u /tmp/v8-04-expected.txt /tmp/v8-04-actual.txt; then
            echo "V8-04-CHANGED-FILE-MANIFEST FAIL"
            echo "The artifact scope does not exactly match the V8-04 changed-file set."
            exit 1
          fi

          echo "V8-04-CHANGED-FILE-MANIFEST PASS"
          echo "Changed files:"
          cat /tmp/v8-04-expected.txt
