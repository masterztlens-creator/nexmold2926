name: NEXMOLD V8 Final Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/v8/**'
      - 'tests/v8/**'
      - 'scripts/v8-final-gate.mjs'
      - 'tsconfig.v8.json'
      - '.github/workflows/v8-final.yml'
      - '.github/workflows/v8-04.yml'

permissions:
  contents: read

jobs:
  v8-final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install V8 compiler only
        run: npm install --no-save --no-package-lock typescript@6.0.3
      - name: V8 Final Gate
        run: node scripts/v8-final-gate.mjs
