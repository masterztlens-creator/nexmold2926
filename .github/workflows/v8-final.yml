name: NEXMOLD V8 Final Gate

on:
  push:
    branches:
      - main
    paths:
      - "build-orchestrator.mjs"
      - "scripts/**"
      - ".github/workflows/v8-final.yml"
      - "src/**"
      - "public/**"
      - "astro.config.mjs"
      - "postcss.config.cjs"
      - "tailwind.config.mjs"
      - "tsconfig.v8.json"
      - "tsconfig.json"
      - "package.json"
      - "package-lock.json"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  v8-final:
    name: V8 Final + Production Integration

    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest

    steps:
      - name: Resolve source SHA
        id: source
        shell: bash
        run: |
          set -euo pipefail

          SHA="${{ github.sha }}"

          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: Invalid source SHA: $SHA"
            exit 1
          fi

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "V8 source SHA: $SHA"

      - name: Checkout exact source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify source/runtime prerequisites
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Runtime ==="
          node --version
          npm --version

          echo "=== Required project files ==="

          test -f package.json
          test -f package-lock.json
          test -f astro.config.mjs
          test -f postcss.config.cjs
          test -f tailwind.config.mjs
          test -f scripts/v8-final-gate.mjs
          test -f scripts/v8-final-publication-gate.mjs
          test -f scripts/v8-production-gate.mjs
          test -f scripts/v8-actual-dist-closure-gate.mjs
          test -f build-orchestrator.mjs

          echo "Required project files: PASS"

          echo "=== Package baseline ==="

          node - <<'NODE'
          const fs = require('node:fs');

          const packageJson = JSON.parse(
            fs.readFileSync('package.json', 'utf8')
          );

          if (packageJson.name !== 'nexmold-v8-full') {
            throw new Error(
              `Unexpected package name: ${packageJson.name}`
            );
          }

          if (
            packageJson.devDependencies?.typescript !== '6.0.3'
          ) {
            throw new Error(
              `Unexpected TypeScript version in package.json: ${
                packageJson.devDependencies?.typescript
              }`
            );
          }

          console.log('package.json baseline: PASS');
          NODE

          echo "=== Lockfile baseline ==="

          node - <<'NODE'
          const fs = require('node:fs');

          const lockfile = JSON.parse(
            fs.readFileSync('package-lock.json', 'utf8')
          );

          if (lockfile.lockfileVersion !== 3) {
            throw new Error(
              `Unexpected lockfileVersion: ${lockfile.lockfileVersion}`
            );
          }

          if (
            lockfile.packages?.['']?.devDependencies?.typescript !==
            '6.0.3'
          ) {
            throw new Error(
              'package-lock.json TypeScript baseline mismatch'
            );
          }

          console.log('package-lock baseline: PASS');
          NODE

      - name: Install production build toolchain
        shell: bash
        run: |
          set -euo pipefail

          npm install \
            --no-save \
            --no-package-lock \
            typescript@6.0.3 \
            astro@6.1.9 \
            @astrojs/check@0.9.9 \
            @astrojs/sitemap \
            tailwindcss@3.4.17 \
            autoprefixer@10.4.21 \
            aos@2.3.4

          echo "=== Verify installed production toolchain ==="

          node - <<'NODE'
          const required = [
            'typescript',
            'astro',
            '@astrojs/check',
            '@astrojs/sitemap',
            'tailwindcss',
            'autoprefixer',
            'aos',
          ];

          for (const name of required) {
            try {
              const resolved = require.resolve(name);

              console.log(
                `dependency ${name}: PASS -> ${resolved}`
              );
            } catch (error) {
              console.error(
                `dependency ${name}: FAIL`
              );
              console.error(error);
              process.exit(1);
            }
          }

          console.log(
            'Production build toolchain: PASS'
          );
          NODE

      - name: Verify critical production source inputs
        shell: bash
        run: |
          set -euo pipefail

          test -f astro.config.mjs
          test -f postcss.config.cjs
          test -f tailwind.config.mjs

          test -d src/pages
          test -d src/layouts
          test -d src/components
          test -d src/styles

          test -f src/layouts/MainLayout.astro

          grep -F "import AOS from 'aos';" \
            src/layouts/MainLayout.astro

          echo "Production source inputs: PASS"

      - name: V8 Final Gate
        shell: bash
        run: |
          set -euo pipefail

          node scripts/v8-final-gate.mjs

      - name: V8-19 Final Publication Gate
        shell: bash
        run: |
          set -euo pipefail

          node scripts/v8-final-publication-gate.mjs

      - name: Verify V8 publication handoff
        shell: bash
        run: |
          set -euo pipefail

          HANDOFF=".nexmold/v8-real-publication-handoff.json"

          if [ ! -f "$HANDOFF" ]; then
            echo "ERROR: Required V8 publication handoff is missing:"
            echo "       $HANDOFF"
            exit 1
          fi

          node - <<'NODE'
          const fs = require('node:fs');

          const path =
            '.nexmold/v8-real-publication-handoff.json';

          const payload = JSON.parse(
            fs.readFileSync(path, 'utf8')
          );

          if (
            payload?.schema !==
            'nexmold.v8.real-publication-handoff.v1'
          ) {
            throw new Error(
              `Unexpected handoff schema: ${payload?.schema}`
            );
          }

          if (
            typeof payload.fingerprint !== 'string' ||
            !/^[0-9a-f]{64}$/.test(payload.fingerprint)
          ) {
            throw new Error(
              'Publication handoff fingerprint is missing or invalid'
            );
          }

          if (
            !Array.isArray(payload.pages) ||
            payload.pages.length !== 3
          ) {
            throw new Error(
              `Expected exactly 3 publication pages, received ${
                payload.pages?.length ?? 0
              }`
            );
          }

          const requiredRoutes = new Set([
            '/knowledge/plastic-injection-molding-wall-thickness/',
            '/de/wissen/plastic-injection-molding-wall-thickness/',
            '/fr/knowledge/plastic-injection-molding-wall-thickness/',
          ]);

          const actualRoutes = new Set(
            payload.pages.map(
              (page) => page?.canonicalRoute
            )
          );

          if (actualRoutes.size !== requiredRoutes.size) {
            throw new Error(
              'Publication handoff contains duplicate or invalid routes'
            );
          }

          for (const route of requiredRoutes) {
            if (!actualRoutes.has(route)) {
              throw new Error(
                `Publication handoff missing required route: ${route}`
              );
            }
          }

          console.log(
            'V8 publication handoff: PASS'
          );

          console.log(
            `handoff fingerprint: ${payload.fingerprint}`
          );

          console.log(
            `publication pages: ${payload.pages.length}`
          );
          NODE

      - name: Upload verified V8 publication handoff
        uses: actions/upload-artifact@v4
        with:
          name: v8-real-publication-handoff
          path: .nexmold/v8-real-publication-handoff.json
          if-no-files-found: error
          retention-days: 7

      - name: Real production build + V8-09 integration chain
        shell: bash
        run: |
          set -euo pipefail

          node --experimental-strip-types \
            build-orchestrator.mjs

      - name: Verify production artifacts
        shell: bash
        run: |
          set -euo pipefail

          test -d dist

          HTML_COUNT="$(find dist -type f -name '*.html' | wc -l)"

          echo "Production HTML artifacts: $HTML_COUNT"

          if [ "$HTML_COUNT" -le 0 ]; then
            echo "ERROR: No production HTML artifacts found."
            exit 1
          fi

          echo "Production artifacts: PASS"

      - name: Verify Closure → Release → LKG identity
        shell: bash
        run: |
          set -euo pipefail

          CLOSURE=".nexmold/v8-actual-dist-production-closure.json"
          RELEASE_STATE=".nexmold/release-state.json"
          LKG=".nexmold/last-known-good.json"

          test -f "$CLOSURE"
          test -f "$RELEASE_STATE"
          test -f "$LKG"

          node - <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');

          const closurePath =
            '.nexmold/v8-actual-dist-production-closure.json';

          const releaseStatePath =
            '.nexmold/release-state.json';

          const lkgPath =
            '.nexmold/last-known-good.json';

          const closure =
            JSON.parse(
              fs.readFileSync(
                closurePath,
                'utf8'
              )
            );

          const releaseState =
            JSON.parse(
              fs.readFileSync(
                releaseStatePath,
                'utf8'
              )
            );

          const lkg =
            JSON.parse(
              fs.readFileSync(
                lkgPath,
                'utf8'
              )
            );

          if (
            closure?.schema !==
            'nexmold.v8.actual-dist-production-closure.v1'
          ) {
            throw new Error(
              `Unexpected closure schema: ${closure?.schema}`
            );
          }

          if (
            releaseState?.schema !==
            'nexmold.v7.14.release-state.v2'
          ) {
            throw new Error(
              `Unexpected release-state schema: ${releaseState?.schema}`
            );
          }

          if (
            releaseState?.status !==
            'VERIFIED'
          ) {
            throw new Error(
              `Release state is not VERIFIED: ${releaseState?.status}`
            );
          }

          if (
            lkg?.schema !==
            'nexmold.v7.14.last-known-good.v3'
          ) {
            throw new Error(
              `Unexpected LKG schema: ${lkg?.schema}`
            );
          }

          if (
            closure.buildEpoch !==
            releaseState.epoch
          ) {
            throw new Error(
              'Closure buildEpoch != release-state epoch'
            );
          }

          if (
            closure.buildEpoch !==
            lkg.epoch
          ) {
            throw new Error(
              'Closure buildEpoch != LKG epoch'
            );
          }

          if (
            !closure.release ||
            typeof closure.release !== 'object'
          ) {
            throw new Error(
              'Closure release identity is missing'
            );
          }

          if (
            !closure.productionExecution ||
            typeof closure.productionExecution !== 'object'
          ) {
            throw new Error(
              'Closure production execution identity is missing'
            );
          }

          if (
            !closure.productionConsumption ||
            typeof closure.productionConsumption !== 'object'
          ) {
            throw new Error(
              'Closure production consumption identity is missing'
            );
          }

          if (
            !lkg.closure ||
            typeof lkg.closure !== 'object'
          ) {
            throw new Error(
              'LKG closure identity is missing'
            );
          }

          if (
            lkg.closure.buildEpoch !==
            closure.buildEpoch
          ) {
            throw new Error(
              'LKG closure epoch mismatch'
            );
          }

          if (
            lkg.closure.releaseId !==
            closure.release.id
          ) {
            throw new Error(
              'LKG release identity mismatch'
            );
          }

          if (
            lkg.closure.releaseFingerprint !==
            closure.release.fingerprint
          ) {
            throw new Error(
              'LKG release fingerprint mismatch'
            );
          }

          if (
            lkg.closure.productionExecutionId !==
            closure.productionExecution.executionId
          ) {
            throw new Error(
              'LKG production execution identity mismatch'
            );
          }

          if (
            lkg.closure.productionExecutionFingerprint !==
            closure.productionExecution.executionFingerprint
          ) {
            throw new Error(
              'LKG production execution fingerprint mismatch'
            );
          }

          if (
            lkg.closure.productionConsumptionId !==
            closure.productionConsumption.consumptionId
          ) {
            throw new Error(
              'LKG production consumption identity mismatch'
            );
          }

          if (
            lkg.closure.productionConsumptionFingerprint !==
            closure.productionConsumption.consumptionFingerprint
          ) {
            throw new Error(
              'LKG production consumption fingerprint mismatch'
            );
          }

          if (
            lkg.releaseManifest !==
            `releases/${lkg.epoch}/manifest.json`
          ) {
            throw new Error(
              'LKG releaseManifest is not bound to its epoch'
            );
          }

          const closureFingerprint =
            crypto
              .createHash('sha256')
              .update(
                fs.readFileSync(
                  closurePath
                )
              )
              .digest('hex');

          if (
            !/^[0-9a-f]{64}$/.test(
              closureFingerprint
            )
          ) {
            throw new Error(
              'Calculated Closure fingerprint is invalid'
            );
          }

          if (
            lkg.closure.fingerprint !==
            closureFingerprint
          ) {
            throw new Error(
              'LKG Closure fingerprint mismatch'
            );
          }

          const releaseManifestPath =
            lkg.releaseManifest;

          if (
            !fs.existsSync(
              releaseManifestPath
            )
          ) {
            throw new Error(
              `Release manifest referenced by LKG is missing: ${releaseManifestPath}`
            );
          }

          const releaseManifest =
            JSON.parse(
              fs.readFileSync(
                releaseManifestPath,
                'utf8'
              )
            );

          if (
            releaseManifest?.schema !==
            'nexmold.v7.14.release-manifest.v3'
          ) {
            throw new Error(
              `Unexpected release manifest schema: ${releaseManifest?.schema}`
            );
          }

          if (
            releaseManifest?.status !==
            'VERIFIED'
          ) {
            throw new Error(
              `Release manifest is not VERIFIED: ${releaseManifest?.status}`
            );
          }

          if (
            releaseManifest.epoch !==
            lkg.epoch
          ) {
            throw new Error(
              'Release manifest epoch != LKG epoch'
            );
          }

          if (
            !releaseManifest.closure ||
            typeof releaseManifest.closure !== 'object'
          ) {
            throw new Error(
              'Release manifest closure identity is missing'
            );
          }

          if (
            releaseManifest.closure.fingerprint !==
            closureFingerprint
          ) {
            throw new Error(
              'Release manifest Closure fingerprint mismatch'
            );
          }

          if (
            releaseManifest.closure.releaseId !==
            closure.release.id
          ) {
            throw new Error(
              'Release manifest release identity mismatch'
            );
          }

          if (
            releaseManifest.closure.releaseFingerprint !==
            closure.release.fingerprint
          ) {
            throw new Error(
              'Release manifest release fingerprint mismatch'
            );
          }

          if (
            releaseManifest.closure.productionExecutionId !==
            closure.productionExecution.executionId
          ) {
            throw new Error(
              'Release manifest production execution identity mismatch'
            );
          }

          if (
            releaseManifest.closure.productionConsumptionId !==
            closure.productionConsumption.consumptionId
          ) {
            throw new Error(
              'Release manifest production consumption identity mismatch'
            );
          }

          console.log(
            'Closure → Release → LKG identity: PASS'
          );

          console.log(
            `buildEpoch: ${closure.buildEpoch}`
          );

          console.log(
            `closureFingerprint: ${closureFingerprint}`
          );

          console.log(
            `releaseId: ${closure.release.id}`
          );

          console.log(
            `releaseFingerprint: ${closure.release.fingerprint}`
          );

          console.log(
            `productionExecutionId: ${closure.productionExecution.executionId}`
          );

          console.log(
            `productionConsumptionId: ${closure.productionConsumption.consumptionId}`
          );
          NODE

      - name: Final integrity summary
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "NEXMOLD V8 FINAL GATE PASS"
          echo "Source SHA: ${{ steps.source.outputs.sha }}"
          echo "=========================================="