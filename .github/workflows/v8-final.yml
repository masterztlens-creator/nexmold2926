name: NEXMOLD V8 Final + Production Integration

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexmold-v8-final-${{ github.ref }}
  cancel-in-progress: false

jobs:
  v8-final:
    name: V8 Final + Production Integration
    runs-on: ubuntu-latest

    env:
      NODE_VERSION: "22.19.0"

    steps:
      - name: Resolve source SHA
        shell: bash
        run: |
          set -euo pipefail

          echo "Source SHA: ${{ github.sha }}"
          echo "Source ref: ${{ github.ref }}"
          echo "Repository: ${{ github.repository }}"

      - name: Checkout exact source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Verify runtime
        shell: bash
        run: |
          set -euo pipefail

          node --version
          npm --version

          node -e '
            const major = Number(process.versions.node.split(".")[0]);

            if (!Number.isInteger(major) || major < 22) {
              throw new Error(
                `Node.js >= 22 is required, got ${process.version}`,
              );
            }

            console.log(`Node.js runtime: ${process.version}`);
          '

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          npm ci

      - name: Verify V8 Final Gate
        shell: bash
        run: |
          set -euo pipefail

          npm run v8:compile
          npm run v8:test

      - name: V8-19 Final Publication Gate
        shell: bash
        run: |
          set -euo pipefail

          node scripts/v8-final-publication-gate.mjs

      - name: Verify publication handoff
        shell: bash
        run: |
          set -euo pipefail

          HANDOFF=".nexmold/v8-real-publication-handoff.json"

          test -f "$HANDOFF"

          node - <<'NODE'
          const fs = require('node:fs');

          const handoffPath =
            '.nexmold/v8-real-publication-handoff.json';

          const payload =
            JSON.parse(
              fs.readFileSync(
                handoffPath,
                'utf8',
              ),
            );

          if (
            !payload ||
            typeof payload !== 'object'
          ) {
            throw new Error(
              'V8 publication handoff is invalid',
            );
          }

          if (
            typeof payload.fingerprint !== 'string' ||
            !payload.fingerprint.trim()
          ) {
            throw new Error(
              'V8 publication handoff fingerprint is missing',
            );
          }

          if (
            !Array.isArray(payload.pages)
          ) {
            throw new Error(
              'V8 publication handoff pages are missing',
            );
          }

          const requiredRoutes = new Set([
            '/knowledge/plastic-injection-molding-wall-thickness/',
            '/de/wissen/plastic-injection-molding-wall-thickness/',
            '/fr/knowledge/plastic-injection-molding-wall-thickness/',
          ]);

          const actualRoutes = new Set(
            payload.pages.map(
              (page) => page?.canonicalRoute,
            ),
          );

          if (
            actualRoutes.size !==
            requiredRoutes.size
          ) {
            throw new Error(
              'Publication handoff contains duplicate or invalid routes',
            );
          }

          for (
            const route of requiredRoutes
          ) {
            if (
              !actualRoutes.has(route)
            ) {
              throw new Error(
                `Publication handoff missing required route: ${route}`,
              );
            }
          }

          console.log(
            'V8 publication handoff: PASS',
          );

          console.log(
            `handoff fingerprint: ${payload.fingerprint}`,
          );

          console.log(
            `publication pages: ${payload.pages.length}`,
          );
          NODE

      - name: Upload verified V8 publication handoff
        uses: actions/upload-artifact@v4
        with:
          name: v8-real-publication-handoff
          path: .nexmold/v8-real-publication-handoff.json
          if-no-files-found: error
          retention-days: 7

      - name: Real production build + V8-09 integration chain
        shell: bash
        run: |
          set -euo pipefail

          node --experimental-strip-types \
            build-orchestrator.mjs

      - name: Verify production artifacts
        shell: bash
        run: |
          set -euo pipefail

          test -d dist

          HTML_COUNT="$(
            find dist \
              -type f \
              -name '*.html' \
              | wc -l
          )"

          echo "Production HTML artifacts: $HTML_COUNT"

          if [ "$HTML_COUNT" -le 0 ]; then
            echo "ERROR: No production HTML artifacts found."
            exit 1
          fi

          echo "Production artifacts: PASS"

      - name: Verify Actual Dist Production Closure
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_STATE=".nexmold/release-state.json"

          test -f "$RELEASE_STATE"

          BUILD_EPOCH="$(
            node -e '
              const fs = require("node:fs");

              const releaseStatePath =
                ".nexmold/release-state.json";

              const releaseState =
                JSON.parse(
                  fs.readFileSync(
                    releaseStatePath,
                    "utf8",
                  ),
                );

              if (
                !releaseState ||
                typeof releaseState !== "object"
              ) {
                throw new Error(
                  "release-state.json is invalid",
                );
              }

              if (
                typeof releaseState.epoch !== "string" ||
                !releaseState.epoch.trim()
              ) {
                throw new Error(
                  "release-state.json does not contain a valid epoch",
                );
              }

              process.stdout.write(
                releaseState.epoch.trim(),
              );
            '
          )"

          export NEXMOLD_BUILD_EPOCH="$BUILD_EPOCH"

          echo "Authoritative build epoch: $NEXMOLD_BUILD_EPOCH"

          node scripts/v8-actual-dist-closure-gate.mjs

      - name: Verify Closure → Release → LKG identity
        shell: bash
        run: |
          set -euo pipefail

          CLOSURE=".nexmold/v8-actual-dist-production-closure.json"
          RELEASE_STATE=".nexmold/release-state.json"
          LKG=".nexmold/last-known-good.json"

          test -f "$CLOSURE"
          test -f "$RELEASE_STATE"
          test -f "$LKG"

          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');

          const closurePath =
            '.nexmold/v8-actual-dist-production-closure.json';

          const releaseStatePath =
            '.nexmold/release-state.json';

          const lkgPath =
            '.nexmold/last-known-good.json';

          const closure =
            JSON.parse(
              fs.readFileSync(
                closurePath,
                'utf8',
              ),
            );

          const releaseState =
            JSON.parse(
              fs.readFileSync(
                releaseStatePath,
                'utf8',
              ),
            );

          const lkg =
            JSON.parse(
              fs.readFileSync(
                lkgPath,
                'utf8',
              ),
            );

          if (
            closure?.schema !==
            'nexmold.v8.actual-dist-production-closure.v1'
          ) {
            throw new Error(
              `Unexpected closure schema: ${closure?.schema}`,
            );
          }

          if (
            releaseState?.schema !==
            'nexmold.v7.14.release-state.v2'
          ) {
            throw new Error(
              `Unexpected release-state schema: ${releaseState?.schema}`,
            );
          }

          if (
            releaseState?.status !==
            'VERIFIED'
          ) {
            throw new Error(
              `Release state is not VERIFIED: ${releaseState?.status}`,
            );
          }

          if (
            lkg?.schema !==
            'nexmold.v7.14.last-known-good.v3'
          ) {
            throw new Error(
              `Unexpected LKG schema: ${lkg?.schema}`,
            );
          }

          if (
            closure.buildEpoch !==
            releaseState.epoch
          ) {
            throw new Error(
              'Closure buildEpoch != release-state epoch',
            );
          }

          if (
            closure.buildEpoch !==
            lkg.epoch
          ) {
            throw new Error(
              'Closure buildEpoch != LKG epoch',
            );
          }

          if (
            !closure.release ||
            typeof closure.release !== 'object'
          ) {
            throw new Error(
              'Closure release identity is missing',
            );
          }

          if (
            !closure.productionExecution ||
            typeof closure.productionExecution !== 'object'
          ) {
            throw new Error(
              'Closure production execution identity is missing',
            );
          }

          if (
            !closure.productionConsumption ||
            typeof closure.productionConsumption !== 'object'
          ) {
            throw new Error(
              'Closure production consumption identity is missing',
            );
          }

          if (
            !lkg.closure ||
            typeof lkg.closure !== 'object'
          ) {
            throw new Error(
              'LKG closure identity is missing',
            );
          }

          if (
            lkg.closure.buildEpoch !==
            closure.buildEpoch
          ) {
            throw new Error(
              'LKG closure epoch mismatch',
            );
          }

          if (
            lkg.closure.releaseId !==
            closure.release.id
          ) {
            throw new Error(
              'LKG release identity mismatch',
            );
          }

          if (
            lkg.closure.releaseFingerprint !==
            closure.release.fingerprint
          ) {
            throw new Error(
              'LKG release fingerprint mismatch',
            );
          }

          if (
            lkg.closure.productionExecutionId !==
            closure.productionExecution.executionId
          ) {
            throw new Error(
              'LKG production execution identity mismatch',
            );
          }

          if (
            lkg.closure.productionExecutionFingerprint !==
            closure.productionExecution.executionFingerprint
          ) {
            throw new Error(
              'LKG production execution fingerprint mismatch',
            );
          }

          if (
            lkg.closure.productionConsumptionId !==
            closure.productionConsumption.consumptionId
          ) {
            throw new Error(
              'LKG production consumption identity mismatch',
            );
          }

          if (
            lkg.closure.productionConsumptionFingerprint !==
            closure.productionConsumption.consumptionFingerprint
          ) {
            throw new Error(
              'LKG production consumption fingerprint mismatch',
            );
          }

          if (
            lkg.releaseManifest !==
            `releases/${lkg.epoch}/manifest.json`
          ) {
            throw new Error(
              'LKG releaseManifest is not bound to its epoch',
            );
          }

          const closureFingerprint =
            crypto
              .createHash('sha256')
              .update(
                fs.readFileSync(
                  closurePath,
                ),
              )
              .digest('hex');

          if (
            !/^[0-9a-f]{64}$/.test(
              closureFingerprint,
            )
          ) {
            throw new Error(
              'Calculated Closure fingerprint is invalid',
            );
          }

          if (
            lkg.closure.fingerprint !==
            closureFingerprint
          ) {
            throw new Error(
              'LKG Closure fingerprint mismatch',
            );
          }

          const releaseManifestPath =
            path.join(
              '.nexmold',
              lkg.releaseManifest,
            );

          if (
            !fs.existsSync(
              releaseManifestPath,
            )
          ) {
            throw new Error(
              `Release manifest referenced by LKG is missing: ${lkg.releaseManifest}`,
            );
          }

          const releaseManifest =
            JSON.parse(
              fs.readFileSync(
                releaseManifestPath,
                'utf8',
              ),
            );

          if (
            releaseManifest?.schema !==
            'nexmold.v7.14.release-manifest.v3'
          ) {
            throw new Error(
              `Unexpected release manifest schema: ${releaseManifest?.schema}`,
            );
          }

          if (
            releaseManifest?.status !==
            'VERIFIED'
          ) {
            throw new Error(
              `Release manifest is not VERIFIED: ${releaseManifest?.status}`,
            );
          }

          if (
            releaseManifest.epoch !==
            lkg.epoch
          ) {
            throw new Error(
              'Release manifest epoch != LKG epoch',
            );
          }

          if (
            !releaseManifest.closure ||
            typeof releaseManifest.closure !== 'object'
          ) {
            throw new Error(
              'Release manifest closure identity is missing',
            );
          }

          if (
            releaseManifest.closure.fingerprint !==
            closureFingerprint
          ) {
            throw new Error(
              'Release manifest Closure fingerprint mismatch',
            );
          }

          if (
            releaseManifest.closure.releaseId !==
            closure.release.id
          ) {
            throw new Error(
              'Release manifest release identity mismatch',
            );
          }

          if (
            releaseManifest.closure.releaseFingerprint !==
            closure.release.fingerprint
          ) {
            throw new Error(
              'Release manifest release fingerprint mismatch',
            );
          }

          if (
            releaseManifest.closure.buildEpoch !==
            closure.buildEpoch
          ) {
            throw new Error(
              'Release manifest Closure epoch mismatch',
            );
          }

          if (
            releaseManifest.closure.productionExecutionId !==
            closure.productionExecution.executionId
          ) {
            throw new Error(
              'Release manifest production execution identity mismatch',
            );
          }

          if (
            releaseManifest.closure.productionExecutionFingerprint !==
            closure.productionExecution.executionFingerprint
          ) {
            throw new Error(
              'Release manifest production execution fingerprint mismatch',
            );
          }

          if (
            releaseManifest.closure.productionConsumptionId !==
            closure.productionConsumption.consumptionId
          ) {
            throw new Error(
              'Release manifest production consumption identity mismatch',
            );
          }

          if (
            releaseManifest.closure.productionConsumptionFingerprint !==
            closure.productionConsumption.consumptionFingerprint
          ) {
            throw new Error(
              'Release manifest production consumption fingerprint mismatch',
            );
          }

          console.log(
            'Closure → Release → LKG identity: PASS',
          );

          console.log(
            `Release epoch: ${releaseManifest.epoch}`,
          );

          console.log(
            `Release manifest: ${releaseManifestPath}`,
          );

          console.log(
            `Closure fingerprint: ${closureFingerprint}`,
          );

          console.log(
            `Release ID: ${closure.release.id}`,
          );

          console.log(
            `Release fingerprint: ${closure.release.fingerprint}`,
          );
          NODE

      - name: Verify final release artifacts
        shell: bash
        run: |
          set -euo pipefail

          CLOSURE=".nexmold/v8-actual-dist-production-closure.json"
          RELEASE_STATE=".nexmold/release-state.json"
          LKG=".nexmold/last-known-good.json"

          test -f "$CLOSURE"
          test -f "$RELEASE_STATE"
          test -f "$LKG"

          node - <<'NODE'
          const fs = require('node:fs');

          const closure =
            JSON.parse(
              fs.readFileSync(
                '.nexmold/v8-actual-dist-production-closure.json',
                'utf8',
              ),
            );

          const releaseState =
            JSON.parse(
              fs.readFileSync(
                '.nexmold/release-state.json',
                'utf8',
              ),
            );

          const lkg =
            JSON.parse(
              fs.readFileSync(
                '.nexmold/last-known-good.json',
                'utf8',
              ),
            );

          if (
            closure.buildEpoch !==
            releaseState.epoch
          ) {
            throw new Error(
              'Final closure/release epoch mismatch',
            );
          }

          if (
            closure.buildEpoch !==
            lkg.epoch
          ) {
            throw new Error(
              'Final closure/LKG epoch mismatch',
            );
          }

          if (
            releaseState.status !==
            'VERIFIED'
          ) {
            throw new Error(
              'Final release state is not VERIFIED',
            );
          }

          console.log(
            'Final release artifacts: PASS',
          );
          NODE

      - name: Final integrity summary
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "NEXMOLD V8 FINAL INTEGRATION"
          echo "========================================"
          echo "Commit: ${{ github.sha }}"
          echo "Repository: ${{ github.repository }}"
          echo "Workflow: ${{ github.workflow }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "========================================"
          echo "V8 Final + Production Integration: PASS"
          echo "========================================"

