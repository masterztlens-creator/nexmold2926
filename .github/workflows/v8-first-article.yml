name: V8 First Article

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v8-first-article
  cancel-in-progress: false

jobs:
  first-article:
    name: Generate and Audit First Article
    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm

      - name: Verify Node.js and npm
        shell: bash
        run: |
          set -euo pipefail

          node --version
          npm --version

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          npm ci

      - name: Compile V8
        shell: bash
        run: |
          set -euo pipefail

          npm run v8:compile

      - name: Generate first article
        shell: bash
        run: |
          set -euo pipefail

          npm run v8:article:first

      - name: Verify first article artifacts
        shell: bash
        run: |
          set -euo pipefail

          ARTICLE_DIR=".nexmold/v8/articles/plastic-injection-molding-wall-thickness"
          ARTICLE_FILE="$ARTICLE_DIR/article.md"
          MANIFEST_FILE="$ARTICLE_DIR/manifest.json"

          test -f "$ARTICLE_FILE"
          test -f "$MANIFEST_FILE"

          test -s "$ARTICLE_FILE"
          test -s "$MANIFEST_FILE"

          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const articlePath =
            ".nexmold/v8/articles/plastic-injection-molding-wall-thickness/article.md";

          const manifestPath =
            ".nexmold/v8/articles/plastic-injection-molding-wall-thickness/manifest.json";

          const article =
            fs.readFileSync(
              articlePath,
              "utf8",
            );

          const manifest =
            JSON.parse(
              fs.readFileSync(
                manifestPath,
                "utf8",
              ),
            );

          if (!article.trim()) {
            throw new Error(
              "V8_FIRST_ARTICLE_EMPTY",
            );
          }

          if (
            !manifest ||
            typeof manifest !== "object"
          ) {
            throw new Error(
              "V8_FIRST_ARTICLE_MANIFEST_INVALID",
            );
          }

          if (
            manifest.schema !==
            "nexmold.v8.first-article-manifest.v2"
          ) {
            throw new Error(
              `V8_FIRST_ARTICLE_MANIFEST_SCHEMA_INVALID:${manifest.schema ?? "missing"}`,
            );
          }

          if (
            manifest.execution?.mode !==
            "LIVE_INTERNET"
          ) {
            throw new Error(
              "V8_FIRST_ARTICLE_EXECUTION_MODE_INVALID",
            );
          }

          if (
            manifest.execution?.searchProvider !==
            "NONE"
          ) {
            throw new Error(
              "V8_FIRST_ARTICLE_SEARCH_PROVIDER_INVALID",
            );
          }

          if (
            manifest.execution?.discoveryProvider !==
            "V8_SELF_OWNED_FIRST_HOP"
          ) {
            throw new Error(
              "V8_FIRST_ARTICLE_DISCOVERY_PROVIDER_INVALID",
            );
          }

          if (
            manifest.execution?.acquisitionProvider !==
            "SELF_OWNED_CRAWL"
          ) {
            throw new Error(
              "V8_FIRST_ARTICLE_ACQUISITION_PROVIDER_INVALID",
            );
          }

          if (
            manifest.article?.title !==
            "Plastic Injection Molding Wall Thickness"
          ) {
            throw new Error(
              "V8_FIRST_ARTICLE_TITLE_INVALID",
            );
          }

          if (
            manifest.article?.slug !==
            "plastic-injection-molding-wall-thickness"
          ) {
            throw new Error(
              "V8_FIRST_ARTICLE_SLUG_INVALID",
            );
          }

          if (
            manifest.article?.primaryKeyword !==
            "plastic injection molding wall thickness"
          ) {
            throw new Error(
              "V8_FIRST_ARTICLE_KEYWORD_INVALID",
            );
          }

          if (
            manifest.article?.artifact !==
            "article.md"
          ) {
            throw new Error(
              "V8_FIRST_ARTICLE_ARTIFACT_INVALID",
            );
          }

          if (
            typeof manifest.artifact?.path !==
              "string" ||
            manifest.artifact.path.length === 0
          ) {
            throw new Error(
              "V8_FIRST_ARTICLE_ARTIFACT_PATH_MISSING",
            );
          }

          if (
            typeof manifest.artifact?.contentFingerprint !==
              "string" ||
            manifest.artifact.contentFingerprint.length === 0
          ) {
            throw new Error(
              "V8_FIRST_ARTICLE_CONTENT_FINGERPRINT_MISSING",
            );
          }

          if (
            typeof manifest.manifestFingerprint !==
              "string" ||
            manifest.manifestFingerprint.length === 0
          ) {
            throw new Error(
              "V8_FIRST_ARTICLE_MANIFEST_FINGERPRINT_MISSING",
            );
          }

          const discovery =
            manifest.discovery;

          if (
            !discovery ||
            typeof discovery !== "object"
          ) {
            throw new Error(
              "V8_FIRST_ARTICLE_DISCOVERY_SECTION_MISSING",
            );
          }

          if (
            !Number.isInteger(
              discovery.bootstrapMatches,
            ) ||
            discovery.bootstrapMatches < 1
          ) {
            throw new Error(
              "V8_FIRST_ARTICLE_BOOTSTRAP_MATCHES_INVALID",
            );
          }

          if (
            !Number.isInteger(
              discovery.pagesObserved,
            ) ||
            discovery.pagesObserved < 1
          ) {
            throw new Error(
              "V8_FIRST_ARTICLE_PAGES_OBSERVED_INVALID",
            );
          }

          if (
            !Number.isInteger(
              discovery.candidatesAccepted,
            ) ||
            discovery.candidatesAccepted < 1
          ) {
            throw new Error(
              "V8_FIRST_ARTICLE_CANDIDATES_ACCEPTED_INVALID",
            );
          }

          if (
            !Array.isArray(
              discovery.candidates,
            ) ||
            discovery.candidates.length === 0
          ) {
            throw new Error(
              "V8_FIRST_ARTICLE_DISCOVERY_CANDIDATES_MISSING",
            );
          }

          const acquisition =
            manifest.acquisition;

          if (
            !acquisition ||
            typeof acquisition !== "object"
          ) {
            throw new Error(
              "V8_FIRST_ARTICLE_ACQUISITION_SECTION_MISSING",
            );
          }

          if (
            !Number.isInteger(
              acquisition.successfulAcquisitions,
            ) ||
            acquisition.successfulAcquisitions < 1
          ) {
            throw new Error(
              "V8_FIRST_ARTICLE_SUCCESSFUL_ACQUISITIONS_INVALID",
            );
          }

          if (
            !Array.isArray(
              acquisition.sources,
            ) ||
            acquisition.sources.length === 0
          ) {
            throw new Error(
              "V8_FIRST_ARTICLE_ACQUISITION_SOURCES_MISSING",
            );
          }

          if (
            acquisition.successfulAcquisitions !==
            acquisition.sources.length
          ) {
            throw new Error(
              "V8_FIRST_ARTICLE_ACQUISITION_SOURCE_COUNT_MISMATCH",
            );
          }

          const sourceIds =
            new Set();

          const snapshotIds =
            new Set();

          const sourceEvidenceIds =
            new Set();

          for (
            const source of
              acquisition.sources
          ) {
            if (
              typeof source?.candidateUrl !==
                "string" ||
              source.candidateUrl.length === 0
            ) {
              throw new Error(
                "V8_FIRST_ARTICLE_SOURCE_CANDIDATE_URL_MISSING",
              );
            }

            if (
              typeof source?.requestedUrl !==
                "string" ||
              source.requestedUrl.length === 0
            ) {
              throw new Error(
                "V8_FIRST_ARTICLE_SOURCE_REQUESTED_URL_MISSING",
              );
            }

            if (
              typeof source?.finalUrl !==
                "string" ||
              source.finalUrl.length === 0
            ) {
              throw new Error(
                "V8_FIRST_ARTICLE_SOURCE_FINAL_URL_MISSING",
              );
            }

            if (
              typeof source?.sourceId !==
                "string" ||
              source.sourceId.length === 0
            ) {
              throw new Error(
                "V8_FIRST_ARTICLE_SOURCE_ID_MISSING",
              );
            }

            if (
              typeof source?.snapshotId !==
                "string" ||
              source.snapshotId.length === 0
            ) {
              throw new Error(
                "V8_FIRST_ARTICLE_SNAPSHOT_ID_MISSING",
              );
            }

            if (
              sourceIds.has(
                source.sourceId,
              )
            ) {
              throw new Error(
                `V8_FIRST_ARTICLE_DUPLICATE_SOURCE_ID:${source.sourceId}`,
              );
            }

            if (
              snapshotIds.has(
                source.snapshotId,
              )
            ) {
              throw new Error(
                `V8_FIRST_ARTICLE_DUPLICATE_SNAPSHOT_ID:${source.snapshotId}`,
              );
            }

            sourceIds.add(
              source.sourceId,
            );

            snapshotIds.add(
              source.snapshotId,
            );

            if (
              !Array.isArray(
                source?.evidenceIds,
              ) ||
              source.evidenceIds.length === 0
            ) {
              throw new Error(
                `V8_FIRST_ARTICLE_SOURCE_EVIDENCE_IDS_MISSING:${source.sourceId}`,
              );
            }

            for (
              const evidenceId of
                source.evidenceIds
            ) {
              if (
                typeof evidenceId !==
                  "string" ||
                evidenceId.trim().length === 0
              ) {
                throw new Error(
                  `V8_FIRST_ARTICLE_SOURCE_EVIDENCE_ID_INVALID:${source.sourceId}`,
                );
              }

              sourceEvidenceIds.add(
                evidenceId,
              );
            }
          }

          const foundation =
            manifest.foundation;

          if (
            !foundation ||
            typeof foundation !== "object"
          ) {
            throw new Error(
              "V8_FIRST_ARTICLE_FOUNDATION_SECTION_MISSING",
            );
          }

          const verifiedEvidenceIds =
            foundation.verifiedEvidenceIds;

          const claimIds =
            foundation.claimIds;

          const knowledgeIds =
            foundation.knowledgeIds;

          const decisionId =
            foundation.decisionId;

          if (
            !Array.isArray(
              verifiedEvidenceIds,
            ) ||
            verifiedEvidenceIds.length === 0
          ) {
            throw new Error(
              "V8_FIRST_ARTICLE_VERIFIED_EVIDENCE_LINEAGE_MISSING",
            );
          }

          if (
            !Array.isArray(
              claimIds,
            ) ||
            claimIds.length === 0
          ) {
            throw new Error(
              "V8_FIRST_ARTICLE_CLAIM_LINEAGE_MISSING",
            );
          }

          if (
            !Array.isArray(
              knowledgeIds,
            ) ||
            knowledgeIds.length === 0
          ) {
            throw new Error(
              "V8_FIRST_ARTICLE_KNOWLEDGE_LINEAGE_MISSING",
            );
          }

          if (
            typeof decisionId !==
              "string" ||
            decisionId.length === 0
          ) {
            throw new Error(
              "V8_FIRST_ARTICLE_DECISION_LINEAGE_MISSING",
            );
          }

          const verifiedEvidenceSet =
            new Set(
              verifiedEvidenceIds,
            );

          if (
            sourceEvidenceIds.size !==
            verifiedEvidenceSet.size
          ) {
            throw new Error(
              "V8_FIRST_ARTICLE_EVIDENCE_LINEAGE_SET_MISMATCH",
            );
          }

          for (
            const evidenceId of
              sourceEvidenceIds
          ) {
            if (
              !verifiedEvidenceSet.has(
                evidenceId,
              )
            ) {
              throw new Error(
                `V8_FIRST_ARTICLE_SOURCE_EVIDENCE_NOT_VERIFIED:${evidenceId}`,
              );
            }
          }

          const runtime =
            manifest.runtime;

          if (
            !runtime ||
            typeof runtime !== "object"
          ) {
            throw new Error(
              "V8_FIRST_ARTICLE_RUNTIME_SECTION_MISSING",
            );
          }

          if (
            typeof runtime.fingerprint !==
              "string" ||
            runtime.fingerprint.length === 0
          ) {
            throw new Error(
              "V8_FIRST_ARTICLE_RUNTIME_FINGERPRINT_MISSING",
            );
          }

          if (
            !runtime.content ||
            typeof runtime.content !== "object"
          ) {
            throw new Error(
              "V8_FIRST_ARTICLE_RUNTIME_CONTENT_MISSING",
            );
          }

          if (
            typeof runtime.content.id !==
              "string" ||
            runtime.content.id.length === 0
          ) {
            throw new Error(
              "V8_FIRST_ARTICLE_CONTENT_ID_MISSING",
            );
          }

          if (
            runtime.content.decisionId !==
            decisionId
          ) {
            throw new Error(
              "V8_FIRST_ARTICLE_CONTENT_DECISION_LINEAGE_MISMATCH",
            );
          }

          if (
            runtime.content.title !==
            manifest.article.title
          ) {
            throw new Error(
              "V8_FIRST_ARTICLE_CONTENT_TITLE_MISMATCH",
            );
          }

          if (
            !Number.isInteger(
              runtime.content.bodyLength,
            ) ||
            runtime.content.bodyLength < 1
          ) {
            throw new Error(
              "V8_FIRST_ARTICLE_CONTENT_BODY_LENGTH_INVALID",
            );
          }

          if (
            discovery.candidatesAccepted <
            acquisition.candidates
          ) {
            throw new Error(
              "V8_FIRST_ARTICLE_DISCOVERY_ACQUISITION_COUNT_INVALID",
            );
          }

          console.log(
            "Article artifact: PASS",
          );

          console.log(
            `Article bytes: ${Buffer.byteLength(article, "utf8")}`,
          );

          console.log(
            `Content fingerprint: ${manifest.artifact.contentFingerprint}`,
          );

          console.log(
            `Manifest fingerprint: ${manifest.manifestFingerprint}`,
          );

          console.log(
            `Discovery candidates: ${discovery.candidates.length}`,
          );

          console.log(
            `Successful acquisitions: ${acquisition.successfulAcquisitions}`,
          );

          console.log(
            `Verified Evidence: ${verifiedEvidenceIds.length}`,
          );

          console.log(
            `Claims: ${claimIds.length}`,
          );

          console.log(
            `Knowledge: ${knowledgeIds.length}`,
          );

          console.log(
            `Decision: ${decisionId}`,
          );
          NODE

      - name: Audit article provenance
        shell: bash
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const manifestPath =
            ".nexmold/v8/articles/plastic-injection-molding-wall-thickness/manifest.json";

          const manifest =
            JSON.parse(
              fs.readFileSync(
                manifestPath,
                "utf8",
              ),
            );

          const foundation =
            manifest.foundation;

          const acquisition =
            manifest.acquisition;

          const runtime =
            manifest.runtime;

          if (
            !Array.isArray(
              foundation?.verifiedEvidenceIds,
            ) ||
            foundation.verifiedEvidenceIds.length === 0
          ) {
            throw new Error(
              "V8_FIRST_ARTICLE_PROVENANCE_EVIDENCE_MISSING",
            );
          }

          if (
            !Array.isArray(
              foundation?.claimIds,
            ) ||
            foundation.claimIds.length === 0
          ) {
            throw new Error(
              "V8_FIRST_ARTICLE_PROVENANCE_CLAIMS_MISSING",
            );
          }

          if (
            !Array.isArray(
              foundation?.knowledgeIds,
            ) ||
            foundation.knowledgeIds.length === 0
          ) {
            throw new Error(
              "V8_FIRST_ARTICLE_PROVENANCE_KNOWLEDGE_MISSING",
            );
          }

          if (
            typeof foundation?.decisionId !==
              "string" ||
            foundation.decisionId.length === 0
          ) {
            throw new Error(
              "V8_FIRST_ARTICLE_PROVENANCE_DECISION_MISSING",
            );
          }

          if (
            !Array.isArray(
              acquisition?.sources,
            ) ||
            acquisition.sources.length === 0
          ) {
            throw new Error(
              "V8_FIRST_ARTICLE_PROVENANCE_SOURCES_MISSING",
            );
          }

          const sourceIds =
            new Set();

          const snapshotIds =
            new Set();

          const acquiredEvidenceIds =
            new Set();

          for (
            const source of
              acquisition.sources
          ) {
            if (
              sourceIds.has(
                source.sourceId,
              )
            ) {
              throw new Error(
                `V8_FIRST_ARTICLE_DUPLICATE_SOURCE_ID:${source.sourceId}`,
              );
            }

            if (
              snapshotIds.has(
                source.snapshotId,
              )
            ) {
              throw new Error(
                `V8_FIRST_ARTICLE_DUPLICATE_SNAPSHOT_ID:${source.snapshotId}`,
              );
            }

            sourceIds.add(
              source.sourceId,
            );

            snapshotIds.add(
              source.snapshotId,
            );

            for (
              const evidenceId of
                source.evidenceIds
            ) {
              acquiredEvidenceIds.add(
                evidenceId,
              );
            }
          }

          const verifiedEvidenceIds =
            new Set(
              foundation.verifiedEvidenceIds,
            );

          if (
            acquiredEvidenceIds.size !==
            verifiedEvidenceIds.size
          ) {
            throw new Error(
              "V8_FIRST_ARTICLE_PROVENANCE_EVIDENCE_CARDINALITY_MISMATCH",
            );
          }

          for (
            const evidenceId of
              acquiredEvidenceIds
          ) {
            if (
              !verifiedEvidenceIds.has(
                evidenceId,
              )
            ) {
              throw new Error(
                `V8_FIRST_ARTICLE_PROVENANCE_EVIDENCE_NOT_VERIFIED:${evidenceId}`,
              );
            }
          }

          if (
            runtime?.content?.decisionId !==
            foundation.decisionId
          ) {
            throw new Error(
              "V8_FIRST_ARTICLE_PROVENANCE_DECISION_CONTENT_MISMATCH",
            );
          }

          if (
            typeof runtime?.content?.bodyLength !==
              "number" ||
            runtime.content.bodyLength < 1
          ) {
            throw new Error(
              "V8_FIRST_ARTICLE_PROVENANCE_CONTENT_EMPTY",
            );
          }

          if (
            foundation.claimIds.length < 1
          ) {
            throw new Error(
              "V8_FIRST_ARTICLE_PROVENANCE_NO_CLAIMS",
            );
          }

          if (
            foundation.knowledgeIds.length < 1
          ) {
            throw new Error(
              "V8_FIRST_ARTICLE_PROVENANCE_NO_KNOWLEDGE",
            );
          }

          console.log(
            "Article provenance: PASS",
          );

          console.log(
            `Sources: ${sourceIds.size}`,
          );

          console.log(
            `Snapshots: ${snapshotIds.size}`,
          );

          console.log(
            `Evidence: ${verifiedEvidenceIds.size}`,
          );

          console.log(
            `Claims: ${foundation.claimIds.length}`,
          );

          console.log(
            `Knowledge: ${foundation.knowledgeIds.length}`,
          );

          console.log(
            `Decision: ${foundation.decisionId}`,
          );

          console.log(
            `Content: ${runtime.content.id}`,
          );
          NODE

      - name: Upload first article artifact
        uses: actions/upload-artifact@v4
        with:
          name: v8-first-article-plastic-injection-molding-wall-thickness
          if-no-files-found: error
          retention-days: 14
          path: |
            .nexmold/v8/articles/plastic-injection-molding-wall-thickness/article.md
            .nexmold/v8/articles/plastic-injection-molding-wall-thickness/manifest.json

      - name: Final result
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "NEXMOLD V8 FIRST ARTICLE CI: PASS"
          echo "=============================================="