name: V8 Article Runtime Gate

on:
  workflow_dispatch:

jobs:
  v8-article-runtime:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify TypeScript
        run: |
          node -e "const p=require('./package.json'); if(p.devDependencies?.typescript !== '6.0.3' && p.dependencies?.typescript !== '6.0.3') process.exit(1)"
          ./node_modules/.bin/tsc --version

      - name: Compile V8
        run: npm run v8:compile

      - name: Verify V8 build output
        run: |
          test -f .v8-build/src/v8/foundation/store.js
          test -f .v8-build/src/v8/acquisition/page-fetcher.js
          test -f .v8-build/src/v8/acquisition/tavily-search-provider.js
          test -f .v8-build/src/v8/runtime/article-runtime.js

      - name: Real Internet Article Runtime Gate
        env:
          V8_SEARCH_API_KEY: ${{ secrets.V8_SEARCH_API_KEY }}
        run: node scripts/v8-article-runtime-gate.mjs